; VMX firmware on the M5Stack CoreS3 + Faces Bottom3 + Gamepad3 (the VMX's ESP32-S3 test rig).
;   pio run -t upload -t monitor     (build + flash, then show the serial log)
; The firmware itself is ../core (shared with the PC test build); src/c_*.c pull it in, and FOLD ROOMS comes from
; ../../microgames/fold.

[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@^6.9.0
board = m5stack-cores3
framework = arduino
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
build_unflags = -Os
lib_deps =
  m5stack/M5Unified@^0.2.2
