; VMX firmware on the M5Stack CoreS3 + Faces Bottom3 + Gamepad3 (the VMX's ESP32-S3 test rig).
;   pio run -t upload --upload-port /dev/ttyACM0      (USB)
;   pio run -e ota -t upload                          (Wi-Fi, once the VMX is on your network: SETTINGS > WIFI)
;   tools/push_game.sh build/games/BLOX.VXP           (put a game on it over Wi-Fi, no reflash)
; The firmware itself is ../core (shared with the PC test build) + ../runtime (the managed-code runtime); src/c_*.c
; pull them in. ota_secret.ini (made once, not in git) holds the upload password.

[platformio]
default_envs = cores3
extra_configs = ota_secret.ini

[env:cores3]
platform = espressif32@^6.9.0
board = m5stack-cores3
framework = arduino
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  '-DOTA_PASSWORD="${ota.password}"'
build_unflags = -Os
lib_deps =
  m5stack/M5Unified@^0.2.2
  tzapu/WiFiManager@^2.0.17

[env:ota]
extends = env:cores3
upload_protocol = espota
upload_port = vmx.local
upload_flags = --auth=${ota.password}
